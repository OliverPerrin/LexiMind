[tool.poetry]
name = "leximind"
version = "0.1.0"
description = "Book discovery and a from-scratch multitask transformer"
authors = ["Oliver Perrin <oliver.t.perrin@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
torch = ">=2.0.0"
transformers = ">=4.30.0"
tokenizers = ">=0.13.0"
numpy = ">=1.24.0"
scikit-learn = ">=1.3.0"
nltk = ">=3.8.0"
tqdm = ">=4.65.0"
pyyaml = ">=6.0"
omegaconf = ">=2.3.0"
huggingface_hub = ">=0.20.0"
hydra-core = "^1.3.0"
bitsandbytes = {version = ">=0.41.0", optional = true}
accelerate = ">=0.21.0"
mlflow = ">=2.0.0"
sentencepiece = ">=0.1.99"

gradio = {version = ">=4.44.0,<6.0", optional = true}
pyarrow = {version = ">=25.0.1", optional = true}
tensorboard = {version = ">=2.13.0", optional = true}

[tool.poetry.extras]
demo = ["gradio"]
data = ["pyarrow"]
quantization = ["bitsandbytes"]
profiling = ["tensorboard"]

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
ruff = "^0.4.0"
mypy = "^1.4.0"
pre-commit = "^3.4.0"
rouge-score = "^0.1.2"
bert-score = "^0.3.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "numpy.*",
    "sklearn.*",
    "nltk.*",
    "tqdm.*",
    "yaml.*",
    "omegaconf.*",
    "huggingface_hub.*",
    "hydra.*",
    "bitsandbytes.*",
    "accelerate.*",
    "mlflow.*",
    "rouge_score.*",
    "bert_score.*",
    "pytest",
    "pytest.*",
]
ignore_missing_imports = true
follow_imports = "skip"
