# Full Training Configuration for FLAN-T5-base
# OPTIMIZED FOR RTX 4070 12GB — no shared memory spillover
# Target: Best results for research paper (Train-Short-Infer-Long campaign)
# VRAM Usage: ~7-8GB dedicated (12GB available) with 4 frozen encoder layers
# Training time: ~10-11 hours on RTX 4070 12GB (8 epochs with full data)
# Data: ~62K summarization (45K academic + ~17K literary), 43K emotion, 3.4K topic
# Use: python scripts/train.py training=full
#
# Recipe history:
#   v1 (8ep, freeze=4, ls=0.1, emo_w=1.0): seed-17 → ROUGE-1 0.307, EmoF1 0.485, TopAcc 0.859
#   v2 (5ep, freeze=0, ls=0.0, emo_w=1.0): seed-17 → ROUGE-1 0.304, EmoF1 0.408, TopAcc 0.833 (regression)
#   v3 (current, 8ep, freeze=4, ls=0.1, emo_w=1.2): pushes emotion which was still climbing at ep8

dataloader:
  batch_size: 16 
  shuffle: true
  num_workers: 4  # Reduced from 6 — fewer pinned memory buffers
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2  # Reduced from 3

optimizer:
  name: adamw
  lr: 3.0e-5  # Balanced - not too high (instability) not too low (slow)
  weight_decay: 0.01  # Standard regularization
  eps: 1.0e-6
  betas: [0.9, 0.98]  # Slightly faster momentum decay

scheduler:
  name: cosine
  warmup_steps: 350  # ~0.24 epoch warmup (~1476 optimizer steps/epoch with 62K summ data)

trainer:
  tasks: [summarization, emotion, topic]  # Tasks to train. Override to one task for single-task baselines.
  max_epochs: 8  # Summarization plateaus at ep5 but emotion F1 climbs through ep8 (+0.034 over ep5).
  gradient_clip_norm: 1.0
  gradient_accumulation_steps: 3
  validation_max_length: 128
  label_smoothing: 0.1
  task_weights:
    summarization: 1.0  # Main task
    emotion: 1.2        # Pushed above 1.0 since emotion F1 was still climbing at ep8 in v1.
    topic: 0.3          # LOW - only 3.4k samples, cycles 14x/epoch, risk of overfit
  max_train_samples: null  # Use all available data
  max_val_samples: 3000  # Enough for stable metrics
  early_stopping_patience: 3  # Stop quickly when plateauing
  log_grad_norm_frequency: 200
  # Task sampling: "round_robin" or "temperature"
  # Temperature sampling: p_i proportional to n_i^alpha, reduces dominance of large tasks
  task_sampling: temperature
  task_sampling_alpha: 0.5
  # Gradient conflict diagnostics: compute inter-task gradient cosine similarity
  # every N steps (0 = disabled). Helps diagnose negative transfer.
  gradient_conflict_frequency: 0
  # PCGrad: Project Conflicting Gradients (Yu et al., NeurIPS 2020)
  # Projects conflicting task gradients to reduce negative transfer.
  # Default: false (enable with use_pcgrad=true override)
  # NOTE: PCGrad retains all task graphs simultaneously (retain_graph=True),
  # roughly doubling peak activation memory. With 12GB VRAM, use batch_size=4
  # and gradient_accumulation_steps=10 when enabling PCGrad.
  use_pcgrad: false

compile_encoder: true
compile_decoder: false  # Decoder only serves summarization (~40-60% of steps with temperature
  # sampling). Its compiled graph cache (self-attn + cross-attn + FFN × 12 layers) wastes
  # ~0.5-1GB VRAM for a module that's idle the rest of the time. Encoder compilation
  # benefits all 3 tasks.

# Quality settings
tokenizer_max_length: 512  # Full context — sources already truncated (median ~900 tokens)
gradient_checkpointing: true

use_relative_position_bias: true

# Freeze lower 4 encoder layers. v2 (freeze=0) regressed emotion F1 by 0.04 — the lower layers were
# providing useful regularisation by preserving FLAN-T5 pretrained features for the classification heads.
freeze_encoder_layers: 4
