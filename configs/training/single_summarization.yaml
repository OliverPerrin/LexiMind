# Single-Task Summarization Baseline
# Inherits everything from full.yaml; only summarization is enabled.
# Used to measure MTL gain/loss vs single-task baseline (Train-Short-Infer-Long paper).
# Use: python scripts/train.py training=single_summarization

defaults:
  - full
  - _self_

trainer:
  tasks: [summarization]
  task_weights:
    summarization: 1.0
