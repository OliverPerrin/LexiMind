# Single-Task Emotion Baseline
# Inherits everything from full.yaml; only emotion classification is enabled.
# Used to measure MTL gain/loss vs single-task baseline (Train-Short-Infer-Long paper).
# Use: python scripts/train.py training=single_emotion

defaults:
  - full
  - _self_

trainer:
  tasks: [emotion]
  task_weights:
    emotion: 1.0
