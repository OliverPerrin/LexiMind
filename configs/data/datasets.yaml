# Dataset paths for LexiMind
# Data is downloaded via: python scripts/download_data.py

processed:
  summarization: data/processed/summarization  # Goodreads descriptions (literary) + arXiv abstracts (academic)
  emotion: data/processed/emotion              # GoEmotions (28 labels)
  topic: data/processed/topic                  # Hand-curated Gutenberg + arXiv (7 labels)

tokenizer:
  pretrained_model_name: google/flan-t5-base
  max_length: 512
  lower: false
