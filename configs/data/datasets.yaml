# Explicit directories for the tasks selected by training.trainer.tasks.
# Candidates are prepared by scripts/research.py source subcommands. They remain unadmitted.
# Supply reviewed split directories when running a separately authorized experiment.
processed:
  summarization: null
  emotion: null
  topic: null

# Opt in only with separate reviewed title/description + positive/negative splits.
topic_problem_type: single_label

tokenizer:
  pretrained_model_name: google/flan-t5-base
  max_length: 512
  lower: false
