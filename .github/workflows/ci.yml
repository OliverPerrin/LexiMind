name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-quality.txt
        
    - name: Lint with Ruff
      run: |
        ruff check .
        ruff format --check .
        
    - name: Type check with Mypy
      run: |
        mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-24.04
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      id: python
      with:
        python-version: "3.10"
        cache: 'pip'
        cache-dependency-path: |
          requirements-test.txt
          requirements-quality.txt
    - name: Cache software-test environment
      id: environment
      uses: actions/cache@v4
      with:
        path: .venv-ci
        key: ubuntu24-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-cpu-torch214-v1-${{ hashFiles('requirements-test.txt', 'requirements-quality.txt') }}
        
    - name: Install dependencies
      if: steps.environment.outputs.cache-hit != 'true'
      run: |
        python -m venv .venv-ci
        .venv-ci/bin/python -m pip install --upgrade pip
        .venv-ci/bin/python -m pip install torch==2.14.0+cpu --index-url https://download.pytorch.org/whl/cpu
        .venv-ci/bin/python -m pip install -r requirements-test.txt
        
    - name: Run tests
      run: |
        .venv-ci/bin/python -m pytest tests/ -x -q --tb=short
